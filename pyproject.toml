[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eoc-neutral-atom-pipeline"
version = "0.2.0"
description = "Geographical reconstruction and raw-sample replay of EOC MDS benchmarks."
requires-python = ">=3.12"
dependencies = [
  "networkx==3.6.1",
  "numpy==2.3.5",
  "scipy==1.17.0",
  "matplotlib==3.10.8",
  "PyYAML==6.0.3",
  "shapely==2.1.2",
  "pyproj==3.7.2"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["eoc_na*", "eoc_geo*", "tools*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
